apiVersion: v1
kind: ConfigMap
metadata:
  name: kubetyper-config
  namespace: kubetyper-production
  labels:
    app: kubetyper
data:
  # Backend configuration
  NODE_ENV: "production"
  PORT: "8080"
  LOG_LEVEL: "info"
  CORS_ORIGIN: "*"
  
  # Frontend configuration
  NGINX_PORT: "80"
  
  # Database configuration (non-sensitive)
  DB_POOL_SIZE: "20"
  DB_TIMEOUT: "30000"
  DB_CONNECTION_TIMEOUT: "2000" 