apiVersion: v1
kind: Service
metadata:
  name: kubetyper-frontend-service
  namespace: kubetyper-production
  labels:
    app: kubetyper-frontend
    component: ui
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: kubetyper-frontend 